<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Portal Gateway - Ma'din Suffa Campus</title>
  <script>
    // Route to appropriate workspace based on authentication
    (function() {
      const auth = localStorage.getItem('suffa_auth') || sessionStorage.getItem('suffa_auth');
      if (auth) {
        try {
          const user = JSON.parse(auth);
          if (user.role === 'admissions') {
            window.location.replace('admissions.html');
            return;
          }
          window.location.replace('gallery.html');
          return;
        } catch(e) {}
      }
      window.location.replace('login.html');
    })();
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #faf8ff;">
  <p style="color: #003e6b; font-weight: bold;">Loading Ma'din Suffa Campus Admin Portal...</p>
</body>
</html>
